name: Hypertext
slug: hypertext
type: theme
version: 2.0.0
description: "Hypertext is a lean semantic HTML5 theme with no JavaScript or stylesheet required by default."
icon: compress
author:
  name: Alejo Grigera Sutro
  email: hypertext@artofthesmart.com
  url: https://artofthesmart.com
homepage: https://github.com/artofthesmart/hypertext
demo: https://hypertext.artofthesmart.com
keywords: theme, simple, fast, semantic, html5, performance
bugs: https://github.com/artofthesmart/hypertext/issues
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }

compatibility:
  grav: ['2.0', '2.1', '2.2']

form:
  validation: strict
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        structure:
          type: tab
          title: Structure
          fields:
            navigation_section:
              type: section
              title: Navigation
              underline: true
            navigation.mode:
              type: select
              label: Navigation display
              default: inline
              options:
                inline: Inline links
                stacked: Stacked list
            navigation.decoration:
              type: select
              label: Inline text decoration
              default: braced
              options:
                braced: "[ Link ]"
                angled: "< Link >"
                plain: Plain
            navigation.pagination:
              type: select
              label: Pagination display
              default: inline
              options:
                inline: Inline links
                stacked: Stacked list
            navigation.custom-items:
              type: list
              style: vertical
              label: Additional navigation links
              fields:
                .text:
                  type: text
                  label: Link text
                .href:
                  type: text
                  label: URL
                .title:
                  type: text
                  label: Advisory title
                .rel:
                  type: text
                  label: Relationship
                .offsite:
                  type: toggle
                  label: Add offsite class
                  default: 0
                  options:
                    1: Enabled
                    0: Disabled
                  validate:
                    type: bool
                .new-window:
                  type: toggle
                  label: Open in a new window
                  default: 0
                  options:
                    1: Enabled
                    0: Disabled
                  validate:
                    type: bool
            header_section:
              type: section
              title: Site header
              underline: true
            header.custom-html:
              type: textarea
              label: Custom header HTML
              help: Leave blank to render the site title.
            header.show-description:
              type: toggle
              label: Show site description
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool
            footer_section:
              type: section
              title: Site footer
              underline: true
            footer.format:
              type: select
              label: Footer format
              default: markdown
              options:
                markdown: Markdown
                html: HTML
            footer.content:
              type: textarea
              label: Footer content
        content:
          type: tab
          title: Content
          fields:
            columns:
              type: columns
              fields:
                page_column:
                  type: column
                  fields:
                    page_section:
                      type: section
                      title: Page defaults
                      underline: true
                    content.title:
                      type: toggle
                      label: Show title
                      default: 1
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    content.subtitle:
                      type: toggle
                      label: Show subtitle
                      default: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    content.image:
                      type: toggle
                      label: Show header image
                      default: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    content.date:
                      type: select
                      label: Date
                      default: published
                      options:
                        none: None
                        published: Published
                        modified: Modified
                        both: Published and modified
                    content.categories:
                      type: toggle
                      label: Show categories
                      default: 1
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    content.tags:
                      type: toggle
                      label: Show tags
                      default: 1
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                collection_column:
                  type: column
                  fields:
                    collection_section:
                      type: section
                      title: Collection defaults
                      underline: true
                    collection.layout:
                      type: select
                      label: Layout
                      default: list
                      options:
                        list: List
                        comfy: Comfy
                        table: Table
                        grid: Grid
                        cards: Cards
                    collection.nested:
                      type: toggle
                      label: Show nested children
                      default: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    collection.display.title:
                      type: toggle
                      label: Show titles
                      default: 1
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    collection.display.subtitle:
                      type: toggle
                      label: Show subtitles
                      default: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    collection.display.image:
                      type: toggle
                      label: Show thumbnails
                      default: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    collection.display.date:
                      type: select
                      label: Date
                      default: published
                      options:
                        none: None
                        published: Published
                        modified: Modified
                        both: Published and modified
                    collection.display.categories:
                      type: toggle
                      label: Show categories
                      default: 1
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    collection.display.tags:
                      type: toggle
                      label: Show tags
                      default: 1
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    collection.display.summary:
                      type: toggle
                      label: Show summaries
                      default: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                    collection.display.read-more:
                      type: toggle
                      label: Show read-more links
                      default: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
        style:
          type: tab
          title: Style & assets
          fields:
            style_section:
              type: section
              title: Aesthetic options
              underline: true
            style.preset:
              type: select
              label: Stylesheet preset
              data-options@: '\Grav\Theme\Hypertext::stylesheetOptions'
            style.custom-css:
              type: textarea
              label: Custom CSS
              size: large
            style.accessible-font:
              type: toggle
              label: Use Atkinson Hyperlegible
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool
            layout_section:
              type: section
              title: Layout
              underline: true
            layout.alignment:
              type: select
              label: Page alignment
              default: left
              options:
                left: Left
                center: Center
                right: Right
            layout.width:
              type: select
              label: Maximum content width
              default: 960
              options:
                full: Full width
                640: 640px
                768: 768px
                960: 960px
                1024: 1024px
                1280: 1280px
            assets_section:
              type: section
              title: Plugin assets
              underline: true
            assets.css:
              type: toggle
              label: Allow plugin CSS
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool
            assets.js:
              type: toggle
              label: Allow plugin JavaScript
              default: 0
              options:
                1: Enabled
                0: Disabled
              validate:
                type: bool
            favicon:
              name: Favicon
              type: file
              label: Upload favicon.png
              destination: 'image://favicon'
              multiple: false
              accept:
                - image/png
