extends@: default

rules:
  slug:
    pattern: '[a-z][a-z0-9_\-]+'
    min: 2
    max: 80

form:
  fields:
    tabs:
      fields:
        # The Hypertext Tab is where everything else goes.
        hypertext:
          type: tab
          title: Hypertext
          fields:
            columns:
              type: columns
              fields:
                overrides_column:
                  type: column
                  fields:
                    overrides_title:
                      type: section
                      title: JS/CSS Overrides
                      underline: true
                      import@:
                        type: overrides
                        context: theme://blueprints/default-partials
                content_column:
                  type: column
                  title: Extra Content & Metadata
                  fields:
                    content:
                      type: section
                      title: Extra Content
                      underline: true
                      import@:
                        type: extra_content
                        context: theme://blueprints/default-partials
                      