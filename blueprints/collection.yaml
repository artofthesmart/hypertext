extends@: default
child_type: item

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        advanced:
          fields:
            overrides:
              fields:
                header.child_type:
                  default: item
        hypertext:
          type: tab
          title: Hypertext
          fields:
            columns:
              type: columns
              fields:
                overrides_column:
                  type: column
                  fields:
                    child_overrides_title:
                      type: section
                      title: Children & Ordering
                      underline: true
                    header.content.items:
                      type: textarea
                      yaml: true
                      label: Items
                      help: Setting this will force which items render. May break tag/category links.
                      default: '@self.children'                      
                      validate:
                        type: yaml
                    header.content.limit:
                      type: text
                      label: Max Items
                      help: Setting this will limit how many children are shown on this page.  If you install the Pagination plugin, it will limit how many children show on each page.
                      placeholder: 0
                      validate:
                        type: int
                        min: 0
                        max: 4096
                    header.content.order.by:
                      type: select
                      label: Order By
                      help: The attribute by which to sort child pages during rendering.
                      default: folder
                      options:
                        folder: Folder
                        title: Title
                        date: Date
                        default: Default
                    header.content.order.dir:
                      type: select
                      label: Order
                      help: The order in which to show them (e.g. Ascending by Date means newer posts appear near the top).
                      default: desc
                      options:
                        asc: Ascending
                        desc: Descending
                    header.content.sibling_links:
                      type: toggle
                      label: Show prev/next links
                      help: When enabled, children of this page will have "Previous" and "Next" links at the bottom, useful for sequential content.
                      default: 0
                      highlight: 0
                      options:
                        1: Enabled
                        0: Disabled
                      validate:
                        type: bool
                content_column:
                  type: column
                  fields:
                    collection_defaults_title:
                      type: section
                      title: Child Rendering
                      underline: true
                      import@:
                        type: collection_defaults
                        context: theme://blueprints/partials
                    page_defaults_title:
                      type: section
                      title: Page Rendering
                      underline: true
                      import@:
                        type: page_defaults
                        context: theme://blueprints/partials